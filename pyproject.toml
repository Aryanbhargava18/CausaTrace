[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "causatrace"
version = "0.1.0"
description = "A causal reproducibility debugger for Python programs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libcst==1.6.0",
    "rich==13.9.4",
]

[dependency-groups]
dev = [
    "numpy==2.1.3",
    "pytest==8.3.3",
]

[project.scripts]
causatrace = "causatrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/causatrace"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
