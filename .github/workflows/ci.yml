name: CausaTrace judge gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
      - name: Run the same judge gate used locally
        run: make judge
